<!DOCTYPE html>
<html lang="ja" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塾代講管理</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0d6efd">

    <script>
        const savedTheme = localStorage.getItem("theme");
        document.documentElement.setAttribute(
            "data-bs-theme",
            savedTheme ? savedTheme : "light"
        );
    </script>
</head>

<body class="p-2">

<div class="text-end mb-2">
    <button type="button" id="pushBtn" onclick="window.enablePush()" class="btn btn-sm btn-outline-primary">🔔 通知OFF</button>
    <button onclick="toggleTheme()" class="btn btn-sm btn-dark">🌙 ダークモード切替</button>
</div>

{% block content %}{% endblock %}

<script>
function toggleTheme() {
    const current = document.documentElement.getAttribute("data-bs-theme");
    const newTheme = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-bs-theme", newTheme);
    localStorage.setItem("theme", newTheme);
}

function urlBase64ToUint8Array(base64String) {
    const padding = "=".repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    const rawData = window.atob(base64);
    const outputArray = new Uint8Array(rawData.length);

    for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
    }

    return outputArray;
}

<script>
function urlBase64ToUint8Array(base64String) {
    const padding = "=".repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);

    for (let i = 0; i < rawData.length; ++i) {

window.enablePush = async function () {
    

    try {
        const permission = await Notification.requestPermission();
        

        if (permission !== "granted") return;

        const registration = await navigator.serviceWorker.register("/static/service-worker.js");
        

        const keyRes = await fetch("/vapid_public_key");
        const keyData = await keyRes.json();
        

        const oldSub = await registration.pushManager.getSubscription();
        if (oldSub) {
            await oldSub.unsubscribe();
        }

        const subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(keyData.publicKey)
        });

        

        await fetch("/subscribe", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(subscription)
        });

        alert("スマホ通知をONにしました");

    } catch (e) {
        alert("通知登録エラー：" + e.message);
    }
};
</script>
<script>
function urlBase64ToUint8Array(base64String) {
    const padding = "=".repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);

    for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
    }

    return outputArray;
}

async function updatePushButton() {
    const btn = document.getElementById("pushBtn");
    if (!btn) return;

    if (!("Notification" in window)) {
        btn.className = "btn btn-sm btn-secondary";
        btn.innerText = "通知非対応";
        return;
    }

    if (Notification.permission === "granted") {
        btn.className = "btn btn-sm btn-primary";
        btn.innerText = "🔔 通知ON";
    } else {
        btn.className = "btn btn-sm btn-outline-primary";
        btn.innerText = "🔔 通知OFF";
    }
}

window.enablePush = async function () {
    try {
        if (!("serviceWorker" in navigator)) {
            alert("この端末は通知に対応していません");
            return;
        }

        if (!("PushManager" in window)) {
            alert("このブラウザは通知に対応していません");
            return;
        }

        const permission = await Notification.requestPermission();

        if (permission !== "granted") {
            alert("通知が許可されませんでした。ブラウザ設定から通知を許可してください。");
            await updatePushButton();
            return;
        }

        const registration = await navigator.serviceWorker.register("/static/service-worker.js");

        const keyRes = await fetch("/vapid_public_key");
        const keyData = await keyRes.json();

        const oldSub = await registration.pushManager.getSubscription();
        if (oldSub) {
            await oldSub.unsubscribe();
        }

        const subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(keyData.publicKey)
        });

        await fetch("/subscribe", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(subscription)
        });

        alert("スマホ通知をONにしました");
        await updatePushButton();

    } catch (e) {
        alert("通知登録エラー：" + e.message);
        console.error(e);
    }
};

window.addEventListener("load", async function () {
    await updatePushButton();

    if (!("serviceWorker" in navigator)) return;
    if (!("PushManager" in window)) return;
    if (!("Notification" in window)) return;
    if (Notification.permission !== "granted") return;

    try {
        const registration = await navigator.serviceWorker.register("/static/service-worker.js");

        let subscription = await registration.pushManager.getSubscription();

        if (!subscription) {
            const keyRes = await fetch("/vapid_public_key");
            const keyData = await keyRes.json();

            subscription = await registration.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(keyData.publicKey)
            });
        }

        await fetch("/subscribe", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(subscription)
        });

        await updatePushButton();

    } catch (e) {
        console.log("auto subscribe error", e);
    }
});
</script>



</body>
</html>
