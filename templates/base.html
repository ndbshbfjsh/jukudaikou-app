<!DOCTYPE html>
<html lang="ja" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塾代講管理</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0d6efd">

    <script>
        const savedTheme = localStorage.getItem("theme");
        document.documentElement.setAttribute(
            "data-bs-theme",
            savedTheme ? savedTheme : "light"
        );
    </script>
</head>

<body class="p-2">

<div class="text-end mb-2">
    <button type="button" onclick="enablePush()" class="btn btn-sm btn-primary">🔔 通知ON</button>
    <button onclick="toggleTheme()" class="btn btn-sm btn-dark">🌙 ダークモード切替</button>
</div>

{% block content %}{% endblock %}

<script>
function toggleTheme() {
    const current = document.documentElement.getAttribute("data-bs-theme");
    const newTheme = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-bs-theme", newTheme);
    localStorage.setItem("theme", newTheme);
}

function urlBase64ToUint8Array(base64String) {
    const padding = "=".repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    const rawData = window.atob(base64);
    const outputArray = new Uint8Array(rawData.length);

    for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
    }

    return outputArray;
}

async function enablePush() {
    if (!("serviceWorker" in navigator)) {
        alert("この端末は通知に対応していません");
        return;
    }

    if (!("PushManager" in window)) {
        alert("このブラウザはPush通知に対応していません");
        return;
    }

    const permission = await Notification.requestPermission();

    if (permission !== "granted") {
        alert("通知が許可されませんでした");
        return;
    }

    const registration = await navigator.serviceWorker.register("/static/service-worker.js");

    const keyRes = await fetch("/vapid_public_key");
    const keyData = await keyRes.json();

    if (!keyData.publicKey) {
        alert("VAPID_PUBLIC_KEYが設定されていません");
        return;
    }

    const subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(keyData.publicKey)
    });

    await fetch("/subscribe", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(subscription)
    });

    alert("スマホ通知をONにしました");
}

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/static/service-worker.js");
}
</script>

</body>
</html>
