<!DOCTYPE html>
<html lang="ja" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代講管理</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0d6efd"

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>
        (function () {
            const savedTheme = localStorage.getItem("theme");
            document.documentElement.setAttribute(
                "data-bs-theme",
                savedTheme ? savedTheme : "light"
            );
        })();
    </script>

    <style>
        body {
            background: #f5f5f5;
        }

        .main-wrap {
            max-width: 900px;
            margin: 0 auto;
        }

        .top-btn {
            text-align: right;
            margin-bottom: 10px;
        }

        .calendar-title {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
        }

        .calendar-table {
            width: 100%;
            table-layout: fixed;
            background: white;
            border-collapse: collapse;
        }

        .calendar-table th,
        .calendar-table td {
            border: 1px solid #ddd;
            height: 95px;
            vertical-align: top;
            padding: 6px;
            font-size: 22px;
        }

        .calendar-table th {
            text-align: center;
            background: #eee;
        }

        .sun {
            background: #ffcaca !important;
        }

        .sat {
            background: #8ed0ff !important;
        }

        .day-link {
            display: block;
            width: 100%;
            height: 100%;
            text-decoration: none;
            color: #222;
        }

        .other-month {
            color: #bbb;
            background: #f3f3f3;
        }

        .today-cell {
            background: #fff8d8 !important;
        }

        .count-badge {
            display: inline-block;
            background: #0d6efd;
            color: white;
            border-radius: 5px;
            font-size: 13px;
            padding: 2px 6px;
            margin-top: 10px;
        }

        .lesson-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .lesson-table th,
        .lesson-table td {
            border: 1px solid #ddd;
            padding: 12px 8px;
            vertical-align: middle;
        }

        .lesson-table th {
            background: #eee;
            text-align: center;
            font-size: 18px;
        }

        .period-name {
            white-space: nowrap;
            font-size: 20px;
        }

        .lesson-time {
            font-size: 20px;
            white-space: nowrap;
        }

        .small-check {
            width: 22px;
            height: 22px;
        }

        .record-box {
            font-size: 14px;
            margin-bottom: 6px;
            padding: 6px;
            border-radius: 6px;
            background: #f8f9fa;
        }

        .fixed-save {
            position: sticky;
            bottom: 0;
            background: white;
            padding: 10px;
            border-top: 1px solid #ddd;
        }

        @media (max-width: 767px) {
            .calendar-title {
                font-size: 28px;
            }

            .calendar-table th,
            .calendar-table td {
                height: 86px;
                font-size: 20px;
                padding: 5px;
            }

            .lesson-table th {
                font-size: 15px;
            }

            .lesson-table td {
                padding: 10px 5px;
            }

            .period-name,
            .lesson-time {
                font-size: 17px;
            }
        }
    </style>
</head>

<body class="p-2">

<div class="top-btn">
    <button onclick="requestNotificationPermission()" class="btn btn-sm btn-primary">🔔　通知オン</button>
    <button onclick="toggleTheme()" class="btn btn-sm btn-dark">🌙 ダークモード切替</button>
</div>

<div class="main-wrap">
    {% block content %}{% endblock %}
</div>
{% with messages = get_flashed_messages() %}
    {% if messages %}
        <script>
            window.addEventListener("DOMContentLoaded", function() {
                {% for message in messages %}
                    showNotification("代講管理", "{{ message }}");
                {% endfor %}
            });
        </script>
    {% endif %}
{% endwith %}
<script>
function toggleTheme() {
    const current = document.documentElement.getAttribute("data-bs-theme");
    const newTheme = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-bs-theme", newTheme);
    localStorage.setItem("theme", newTheme);
}
</script>
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/static/service-worker.js");
}

function requestNotificationPermission() {
    if (!("Notification" in window)) {
        alert("この端末は通知に対応していません");
        return;
    }

    Notification.requestPermission().then(function(permission) {
        if (permission === "granted") {
            alert("通知をONにしました");
        } else {
            alert("通知が許可されませんでした");
        }
    });
}

function showNotification(title, body) {
    if (!("Notification" in window)) return;

    if (Notification.permission === "granted") {
        new Notification(title, {
            body: body,
            icon: "/static/icon-192.png"
        });
    }
}
</script>
</body>
</html>
