<!DOCTYPE html>
<html lang="ja" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塾代講管理</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0d6efd">

    <script>
        const savedTheme = localStorage.getItem("theme");
        document.documentElement.setAttribute(
            "data-bs-theme",
            savedTheme ? savedTheme : "light"
        );
    </script>
</head>

<body class="p-2">

<div class="text-end mb-2">
    <button type="button" onclick="alert('ボタン反応OK'); enablePush();" class="btn btn-sm btn-primary">
    🔔 通知ON
</button>
    <button onclick="toggleTheme()" class="btn btn-sm btn-dark">🌙 ダークモード切替</button>
</div>

{% block content %}{% endblock %}

<script>
function toggleTheme() {
    const current = document.documentElement.getAttribute("data-bs-theme");
    const newTheme = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-bs-theme", newTheme);
    localStorage.setItem("theme", newTheme);
}

function urlBase64ToUint8Array(base64String) {
    const padding = "=".repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    const rawData = window.atob(base64);
    const outputArray = new Uint8Array(rawData.length);

    for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
    }

    return outputArray;
}

window.enablePush = async function () {
    alert("通知ON開始");

    try {
        if (!("serviceWorker" in navigator)) {
            alert("Service Worker未対応");
            return;
        }

        if (!("PushManager" in window)) {
            alert("Push通知未対応");
            return;
        }

        const permission = await Notification.requestPermission();
        alert("通知許可状態：" + permission);

        if (permission !== "granted") {
            alert("通知が許可されませんでした");
            return;
        }

        const registration = await navigator.serviceWorker.register("/static/service-worker.js");
        alert("Service Worker登録OK");

        const keyRes = await fetch("/vapid_public_key");
        const keyData = await keyRes.json();
        alert("公開キー取得OK");

        const subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(keyData.publicKey)
        });

        alert("通知登録作成OK");

        await fetch("/subscribe", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(subscription)
        });

        alert("スマホ通知をONにしました");

    } catch (e) {
        alert("通知登録エラー：" + e.message);
    }
}
<script>
window.addEventListener("load", async function () {
    if (!("serviceWorker" in navigator)) return;
    if (!("PushManager" in window)) return;
    if (Notification.permission !== "granted") return;

    try {
        const registration = await navigator.serviceWorker.register("/static/service-worker.js");

        let subscription = await registration.pushManager.getSubscription();

        if (!subscription) {
            const keyRes = await fetch("/vapid_public_key");
            const keyData = await keyRes.json();

            subscription = await registration.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(keyData.publicKey)
            });
        }

        await fetch("/subscribe", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(subscription)
        });

    } catch (e) {
        console.log("auto subscribe error", e);
    }
});
</script>

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/static/service-worker.js");
}
</script>

</body>
</html>
