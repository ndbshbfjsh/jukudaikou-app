{% extends "base.html" %}
{% block content %}

<div class="container" style="max-width:600px;">

    <div class="mb-3">
        <a href="/day/{{ data.date }}" class="btn btn-secondary">← 戻る</a>
    </div>

    <h2 class="text-center mb-4">代講編集</h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">日付</label>
            <input type="text" class="form-control" value="{{ data.date }}" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">限</label>
            <input type="text" class="form-control" value="{{ period_times.get(data.period, data.period) }}" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">担当先生</label>
            <input type="text" name="teacher" class="form-control" value="{{ data.teacher or '' }}">
        </div>

        <div class="mb-3">
            <label class="form-label">状態</label>
            <select name="status" class="form-select" onchange="toggleSubTeacher(this)">
                <option value="未定" {% if data.status == "未定" %}selected{% endif %}>未定</option>
                <option value="決定" {% if data.status == "決定" %}selected{% endif %}>決定</option>
            </select>
        </div>

        <div class="mb-3" id="subTeacherField" {% if data.status != "決定" %}style="display:none;"{% endif %}>
            <label class="form-label">代講先生</label>
            <input type="text" name="sub_teacher" class="form-control" value="{{ data.sub_teacher or '' }}">
        </div>

        <div class="mb-3">
            <label class="form-label">メモ</label>
            <textarea name="note" class="form-control">{{ data.note or '' }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary w-100">更新</button>

    </form>
</div>

<script>
function toggleSubTeacher(select) {
    const field = document.getElementById("subTeacherField");
    field.style.display = select.value === "決定" ? "block" : "none";
}
</script>

{% endblock %}
